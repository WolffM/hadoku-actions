name: Promote ppe to main
description: >-
  Fast-forward main to the newest ppe commit whose required checks are green,
  on the cadence (30 min since main last moved, or ppe quiet for 10, or
  forced), and revert the first red ppe push since the last green. Required
  checks are read from main's ruleset, else its branch protection. "Could not
  look" never promotes and never reverts. Usually called through the reusable
  workflow .github/workflows/promote.yml.

inputs:
  deploy-key:
    description: The repo's write deploy key (secret PPE_PROMOTE_KEY), private half.
    required: true
  github-token:
    description: >-
      Token for reads and issues. The job's own GITHUB_TOKEN, which needs
      contents, checks and statuses read and issues write.
    required: true
  force:
    description: "'true' promotes the newest green now, ignoring the cadence."
    required: false
    default: 'false'
  ppe-branch:
    required: false
    default: ppe
  main-branch:
    required: false
    default: main

outputs:
  action:
    description: none | promoted | reverted | promoted+reverted | could-not-look
    value: ${{ steps.promote.outputs.action }}
  promoted:
    description: The sha main was fast-forwarded to, when it was.
    value: ${{ steps.promote.outputs.promoted }}

runs:
  using: composite
  steps:
    - id: promote
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PPE_DEPLOY_KEY: ${{ inputs.deploy-key }}
        PPE_FORCE: ${{ inputs.force }}
        PPE_BRANCH: ${{ inputs.ppe-branch }}
        PPE_MAIN_BRANCH: ${{ inputs.main-branch }}
      run: node "$GITHUB_ACTION_PATH/promote.mjs"

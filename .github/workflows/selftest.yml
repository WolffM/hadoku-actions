name: Self-test

# A shared action has FLEET-WIDE BLAST RADIUS: a bad push here breaks every
# caller at once, where a vendored copy broke one. That is the trade made when
# these files stopped being copy-pasted, and this workflow is what pays for it.
#
# HOSTED ON PURPOSE. This repo is public and has no runner registration, but
# neither is the reason — a public repo executing pull-request code must not
# touch a persistent self-hosted runner, exactly as tenhands' pages.yml is
# hosted. If this repo ever gains a second workflow it crosses autoInclude's
# minWorkflows threshold, enters fleet coverage, and then needs an
# `allowHosted` entry in hadoku_site's repo-policy-manifest.json carrying this
# reason. Until then it is outside the audit.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report-job:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      # EVERY CASE BELOW STOPS BEFORE THE CURL, deliberately. The one path this
      # cannot cover is the POST itself: exercising it means writing rows to the
      # live execution log, and a self-test that fabricates monitoring data is
      # worse than one with a stated gap. The real callers cover that path.

      # An unset key must WARN and skip. It must never fail the job it reports
      # on — a repo that has not been issued a service key yet still has to be
      # able to run its CI.
      - name: an unset service key is a warning, not a failure
        uses: ./report-job
        with:
          job-name: selftest:unset-key
          service-key: ''

      # A cancelled run is concurrency superseding a push, not breakage, and
      # must not clear a live failure streak either. Silent, and no key needed.
      - name: a cancelled outcome is not reported
        uses: ./report-job
        with:
          job-name: selftest:cancelled
          service-key: not-a-real-key
          outcome: cancelled

      # monitoring-api derives `worker` from the prefix before the colon, so a
      # colon-less name lands under a worker equal to the whole name, where no
      # ?worker= query can ever find it. MUST be refused.
      #
      # Asserted by RUNNING it and checking the step failed. A guard nothing
      # fires reads as coverage — this one is the reason the action carries its
      # own copy of monitoring-api's check, so it has to be proven to fire.
      - name: a colon-less job-name is refused
        id: colonless
        continue-on-error: true
        uses: ./report-job
        with:
          job-name: nocolon
          service-key: not-a-real-key

      - name: assert the refusal actually fired
        run: |
          if [ "${{ steps.colonless.outcome }}" != "failure" ]; then
            echo "::error::report-job accepted a colon-less job-name"
            exit 1
          fi
          echo "colon-less job-name refused, as it must be"

  report-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      # A stand-in monitoring-api, same shape as fake-broker.py: this repo is
      # public and hosted, and holds no real service key to hit the live
      # store with. `ok` echoes back a real inserted count so the asserts
      # below can check rows actually arrived, not just that curl ran.
      - name: start a stand-in results store
        run: |
          python3 .github/selftest/fake-e2e-store.py ok 5300 &
          python3 .github/selftest/fake-e2e-store.py deny 5301 &
          for p in 5300 5301; do
            for _ in $(seq 1 20); do curl -s -o /dev/null "http://127.0.0.1:$p/" && break; sleep 0.25; done
          done

      # Both fixtures carry a skip the allow-list below does not cover, so
      # they must fail — and the "report anyway" case right after proves the
      # unallowed skip did not stop the POST from reaching the store.
      - name: playwright fixture, unallowed skip — fails the job
        id: pw-unallowed
        continue-on-error: true
        uses: ./report-e2e
        with:
          report: report-e2e/fixtures/playwright-report.json
          runner: playwright
          app: selftest-pw
          key: selftest-key
          endpoint: http://127.0.0.1:5300/
      - name: assert it failed on the unallowed skip
        run: |
          if [ "${{ steps.pw-unallowed.outcome }}" != "failure" ]; then
            echo "::error::report-e2e did not fail on an unallowed skip (playwright)"
            exit 1
          fi
          echo "failed on the unallowed skip, as it must"

      - name: vitest fixture, unallowed skip — fails the job
        id: vt-unallowed
        continue-on-error: true
        uses: ./report-e2e
        with:
          report: report-e2e/fixtures/vitest-report.json
          runner: vitest
          app: selftest-vt
          key: selftest-key
          endpoint: http://127.0.0.1:5300/
      - name: assert it failed on the unallowed skip
        run: |
          if [ "${{ steps.vt-unallowed.outcome }}" != "failure" ]; then
            echo "::error::report-e2e did not fail on an unallowed skip (vitest)"
            exit 1
          fi
          echo "failed on the unallowed skip, as it must"

      # e2eSkipAllow's CANONICAL shape (manager decision, wave3-2026-10-21.md
      # lane B note, prompted by hadoku-task's real e2e.json) is an object map
      # of {"<test title>": "<one-line reason>"} — the brief itself requires a
      # reason per allowed skip, and only a map can hold one. Turns the SAME
      # fixtures green. Playwright's test_name has no suite prefix; vitest's
      # does (ancestorTitles joined with ' > ') — both forms are listed
      # because the two fixtures use different runners.
      - name: a declared e2eSkipAllow entry makes the same skip pass
        run: |
          mkdir -p tmp-e2e-json
          cat > tmp-e2e-json/e2e.json <<'JSON'
          {"e2eSkipAllow": {
            "a skipped test": "fixture artifact — intentionally skipped",
            "sample suite > a skipped test": "fixture artifact — intentionally skipped"
          }}
          JSON

      - name: playwright fixture, skip allow-listed — passes
        uses: ./report-e2e
        with:
          report: report-e2e/fixtures/playwright-report.json
          runner: playwright
          app: selftest-pw
          key: selftest-key
          endpoint: http://127.0.0.1:5300/
          e2e-json: tmp-e2e-json/e2e.json

      - name: assert the rows actually landed in the store
        run: |
          inserted=$(cat "$RUNNER_TEMP"/report-e2e-post-0.json)
          echo "$inserted" | grep -q '"inserted": *2' \
            || { echo "::error::expected 2 rows inserted, got: $inserted"; exit 1; }
          echo "both rows reported: $inserted"

      # THE SILENT-FALLBACK BUG THIS REPLACES. e2eSkipAllow used to be an
      # array; hadoku-task's real e2e.json declares it as the canonical map
      # (80 entries, one reason each) and the OLD code read
      # `Array.isArray(...) ? ... : []` — silently treating the map as an
      # empty array rather than erroring, which would have failed all 80
      # declared skips with no indication why. The array shape must now fail
      # LOUDLY instead, naming the shape.
      - name: write an e2e.json with the old array shape
        run: |
          mkdir -p tmp-e2e-json
          cat > tmp-e2e-json/array-shape.json <<'JSON'
          {"e2eSkipAllow": ["a skipped test"]}
          JSON
      - name: the old array shape for e2eSkipAllow fails loudly
        id: array-shape-run
        continue-on-error: true
        uses: ./report-e2e
        with:
          report: report-e2e/fixtures/playwright-report.json
          runner: playwright
          app: selftest-array-shape
          key: selftest-key
          endpoint: http://127.0.0.1:5300/
          e2e-json: tmp-e2e-json/array-shape.json
      - name: assert it failed loudly on the array shape
        run: |
          if [ "${{ steps.array-shape-run.outcome }}" != "failure" ]; then
            echo "::error::report-e2e accepted the old array shape for e2eSkipAllow"
            exit 1
          fi
          echo "array shape refused, as it must be"

      # A map entry with an empty (or non-string) reason is equally invalid —
      # the brief requires a REASON per skip, not just a listed title.
      - name: write an e2e.json with an empty reason
        run: |
          mkdir -p tmp-e2e-json
          cat > tmp-e2e-json/empty-reason.json <<'JSON'
          {"e2eSkipAllow": {"a skipped test": ""}}
          JSON
      - name: an empty reason in e2eSkipAllow fails loudly
        id: empty-reason-run
        continue-on-error: true
        uses: ./report-e2e
        with:
          report: report-e2e/fixtures/playwright-report.json
          runner: playwright
          app: selftest-empty-reason
          key: selftest-key
          endpoint: http://127.0.0.1:5300/
          e2e-json: tmp-e2e-json/empty-reason.json
      - name: assert it failed loudly on the empty reason
        run: |
          if [ "${{ steps.empty-reason-run.outcome }}" != "failure" ]; then
            echo "::error::report-e2e accepted an empty e2eSkipAllow reason"
            exit 1
          fi
          echo "empty reason refused, as it must be"

      # 0 tests ran is the other half of the skip rule — a job that measures
      # something must fail on zero rows (wave3-2026-10-21.md, binding).
      - name: 0 tests ran — fails the job
        id: zero
        continue-on-error: true
        uses: ./report-e2e
        with:
          report: report-e2e/fixtures/empty-playwright-report.json
          runner: playwright
          app: selftest-empty
          key: selftest-key
          endpoint: http://127.0.0.1:5300/
      - name: assert it failed on 0 tests
        run: |
          if [ "${{ steps.zero.outcome }}" != "failure" ]; then
            echo "::error::report-e2e did not fail on 0 tests"
            exit 1
          fi
          echo "failed on 0 tests, as it must"

      # pytest is wave 4 — an unrecognised runner must fail loudly rather than
      # silently report nothing.
      - name: an unknown runner is refused
        id: badrunner
        continue-on-error: true
        uses: ./report-e2e
        with:
          report: report-e2e/fixtures/playwright-report.json
          runner: pytest
          app: selftest-bad
          key: selftest-key
          endpoint: http://127.0.0.1:5300/
      - name: assert the refusal actually fired
        run: |
          if [ "${{ steps.badrunner.outcome }}" != "failure" ]; then
            echo "::error::report-e2e accepted runner=pytest"
            exit 1
          fi
          echo "unknown runner refused, as it must be"

      # An unset key must FAIL the job (manager decision, wave3-2026-10-21.md
      # lane B note): a report that never reached the store must look exactly
      # as broken as a run with a real failing test, never like a quiet green
      # night the digest counts as "nothing to see". Paired with the
      # allow-listed fixture so a failure here can only be this, nothing else.
      - name: an unset service key fails the job
        id: nokey
        continue-on-error: true
        uses: ./report-e2e
        with:
          report: report-e2e/fixtures/vitest-report.json
          runner: vitest
          app: selftest-nokey
          key: ''
          endpoint: http://127.0.0.1:5300/
          e2e-json: tmp-e2e-json/e2e.json
      - name: assert it failed on the unset key
        run: |
          if [ "${{ steps.nokey.outcome }}" != "failure" ]; then
            echo "::error::report-e2e did not fail on an unset service key"
            exit 1
          fi
          echo "failed on the unset key, as it must"

      # A STORE REFUSAL (403) IS ALSO A TRANSPORT FAILURE THAT MUST FAIL THE
      # JOB — same reasoning as the unset key above: the row is gone, so the
      # job must go red. Paired with the allow-listed fixture so a failure
      # here can only be the POST, nothing else.
      - name: a store refusal (403) also fails the job
        id: denied
        continue-on-error: true
        uses: ./report-e2e
        with:
          report: report-e2e/fixtures/vitest-report.json
          runner: vitest
          app: selftest-denied
          key: selftest-key
          endpoint: http://127.0.0.1:5301/
          e2e-json: tmp-e2e-json/e2e.json
      - name: assert it failed on the store refusal
        run: |
          if [ "${{ steps.denied.outcome }}" != "failure" ]; then
            echo "::error::report-e2e did not fail on a store refusal (403)"
            exit 1
          fi
          echo "failed on the store refusal, as it must"

  setup-pnpm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: defaults
        id: defaults
        uses: ./setup-pnpm
        with:
          npm-token: not-a-real-token

      # Without vault-key the output IS npm-token, so a caller can move its
      # install step onto the output before it adopts the vault.
      - name: without vault-key the output is npm-token
        run: |
          [ "${{ steps.defaults.outputs.npm-token }}" = "not-a-real-token" ] \
            || { echo "::error::npm-token output did not pass the input through"; exit 1; }
          echo "output passes the input through"

      # The pins are the whole point of the action, so assert them rather than
      # trusting that corepack did what the input said.
      - name: the pinned versions are what actually landed
        run: |
          v=$(pnpm --version)
          [ "$v" = "11.5.0" ] || { echo "::error::pnpm is $v, expected 11.5.0"; exit 1; }
          n=$(node --version)
          case "$n" in v22.*) ;; *) echo "::error::node is $n, expected v22.x"; exit 1 ;; esac
          echo "pnpm $v on node $n"

      # THE NPMRC MUST BE TOKENLESS. setup-node points NPM_CONFIG_USERCONFIG at
      # the file it wrote; it has to carry the literal ${NODE_AUTH_TOKEN} for
      # pnpm to expand at install time. A hand-written npmrc with a real token
      # in it is what this action exists to stop repos doing.
      - name: setup-node wrote a tokenless npmrc
        run: |
          [ -n "$NPM_CONFIG_USERCONFIG" ] || { echo "::error::NPM_CONFIG_USERCONFIG unset"; exit 1; }
          [ -f "$NPM_CONFIG_USERCONFIG" ] || { echo "::error::no npmrc at $NPM_CONFIG_USERCONFIG"; exit 1; }
          grep -qF '${NODE_AUTH_TOKEN}' "$NPM_CONFIG_USERCONFIG" \
            || { echo "::error::npmrc is not tokenless"; exit 1; }
          grep -qF 'npm.pkg.github.com' "$NPM_CONFIG_USERCONFIG" \
            || { echo "::error::npmrc does not name the registry"; exit 1; }
          echo "npmrc is tokenless and points at GitHub Packages"

      # An input nothing asserts is an input that can silently stop working.
      - name: a custom pnpm-version is honoured
        uses: ./setup-pnpm
        with:
          npm-token: not-a-real-token
          pnpm-version: 10.34.5
      - name: assert the custom version landed
        run: |
          v=$(pnpm --version)
          [ "$v" = "10.34.5" ] || { echo "::error::pnpm is $v, expected 10.34.5"; exit 1; }
          echo "custom pin honoured"

      # THE GUARD THIS ACTION EXISTS FOR. An unset secret reads as an empty
      # string, so it must fail here rather than go green against a warm store.
      # Proven by firing it -- a guard nothing fires reads as coverage.
      - name: an empty credential is refused
        id: notoken
        continue-on-error: true
        uses: ./setup-pnpm
        with:
          npm-token: ''

      - name: assert the refusal actually fired
        run: |
          if [ "${{ steps.notoken.outcome }}" != "failure" ]; then
            echo "::error::setup-pnpm accepted an empty registry credential"
            exit 1
          fi
          echo "empty credential refused, as it must be"

      # The escape hatch has to work, or a job that installs nothing from the
      # private registry cannot use this action at all.
      - name: assert-token false skips the check
        uses: ./setup-pnpm
        with:
          npm-token: ''
          assert-token: 'false'

      # ── the vault path ───────────────────────────────────────────────────
      # Against a stand-in broker: the real one is behind hadoku.me and a
      # public repo's hosted runner has no business holding a service key.
      - name: start stand-in brokers
        run: |
          python3 .github/selftest/fake-broker.py ok 5297 &
          python3 .github/selftest/fake-broker.py deny 5298 &
          for p in 5297 5298; do
            for _ in $(seq 1 20); do curl -s -o /dev/null "http://127.0.0.1:$p/" && break; sleep 0.25; done
          done

      - name: vault-key reads the token from the broker
        id: vault
        uses: ./setup-pnpm
        with:
          npm-token: fallback-token
          vault-key: selftest-key
          vault-broker: http://127.0.0.1:5297
      - name: assert the vault value won over the fallback
        run: |
          [ "${{ steps.vault.outputs.npm-token }}" = "tok-from-vault" ] \
            || { echo "::error::expected the vault value, got something else"; exit 1; }
          echo "vault value used"

      # THE POLICY THAT MATTERS. A 403 is the broker answering "no" -- a missing
      # grant or a retired key. Falling back would hide it behind a stale copy
      # for weeks, so it must FAIL even though a fallback is right there.
      - name: a broker refusal (403) is not papered over
        id: denied
        continue-on-error: true
        uses: ./setup-pnpm
        with:
          npm-token: fallback-token
          vault-key: selftest-key
          vault-broker: http://127.0.0.1:5298
      - name: assert the refusal failed the step
        run: |
          if [ "${{ steps.denied.outcome }}" != "failure" ]; then
            echo "::error::a 403 from the broker fell back instead of failing"
            exit 1
          fi
          echo "403 failed loudly, as it must"

      # An UNREACHABLE broker is transport, not authorization: fall back (with a
      # warning) so a hosted-runner failover still installs.
      - name: an unreachable broker falls back
        id: unreachable
        uses: ./setup-pnpm
        with:
          npm-token: fallback-token
          vault-key: selftest-key
          vault-broker: http://127.0.0.1:9
      - name: assert the fallback was used
        run: |
          [ "${{ steps.unreachable.outputs.npm-token }}" = "fallback-token" ] \
            || { echo "::error::unreachable broker did not fall back"; exit 1; }
          echo "fell back to npm-token"

  vault-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: start stand-in brokers
        run: |
          python3 .github/selftest/fake-broker.py ok 5297 &
          python3 .github/selftest/fake-broker.py deny 5298 &
          for p in 5297 5298; do
            for _ in $(seq 1 20); do curl -s -o /dev/null "http://127.0.0.1:$p/" && break; sleep 0.25; done
          done

      - name: fetch two keys into the environment
        uses: ./vault-fetch
        with:
          keys: FIRST_SECRET, SECOND_SECRET
          broker: http://127.0.0.1:5297
        env:
          HADOKU_VAULT_KEY: selftest-key
      - name: assert both landed in GITHUB_ENV
        run: |
          [ "$FIRST_SECRET" = "tok-from-vault" ] && [ "$SECOND_SECRET" = "tok-from-vault" ] \
            || { echo "::error::vault-fetch did not export both keys"; exit 1; }
          echo "both keys exported"

      - name: a refusal fails even with a fallback set
        id: denied
        continue-on-error: true
        uses: ./vault-fetch
        with:
          keys: FIRST_SECRET
          broker: http://127.0.0.1:5298
        env:
          HADOKU_VAULT_KEY: selftest-key
          VAULT_FALLBACK_FIRST_SECRET: stale-copy
      - name: assert the refusal failed the step
        run: |
          if [ "${{ steps.denied.outcome }}" != "failure" ]; then
            echo "::error::vault-fetch fell back on a 403"
            exit 1
          fi
          echo "403 failed loudly"

  setup-python-venv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # A real installable package, because `install` taking an editable target
      # is half the action and a self-test that only ever passes '' would not
      # notice it breaking. `./pkg[dev]` also covers the extras syntax, which is
      # what every caller in the fleet actually passes.
      - name: a throwaway package for the install path
        run: |
          mkdir -p pkg/selftest_pkg
          echo 'VALUE = "from the checkout"' > pkg/selftest_pkg/__init__.py
          cat > pkg/pyproject.toml <<'TOML'
          [project]
          name = "selftest-pkg"
          version = "0.0.0"
          requires-python = ">=3.11"
          [project.optional-dependencies]
          dev = ["ruff==0.16.9"]
          TOML

      # cache: '' because setup-python's pip cache hashes a dependency file and
      # this repo has none at its root. Callers with a pyproject leave it alone.
      - name: build the venv and install
        id: env
        uses: ./setup-python-venv
        with:
          cache: ''
          install: './pkg[dev]'
          assert-imports: ruff selftest_pkg

      # The outputs are a contract; a caller that wants to be explicit uses them
      # instead of relying on PATH.
      - name: the outputs point at a real interpreter
        run: |
          py='${{ steps.env.outputs.python }}'
          venv='${{ steps.env.outputs.venv }}'
          [ -x "$py" ] || { echo "::error::outputs.python is not executable: $py"; exit 1; }
          [ -d "$venv" ] || { echo "::error::outputs.venv is not a directory: $venv"; exit 1; }
          case "$py" in "$RUNNER_TEMP"/*) ;; *) echo "::error::venv is not under RUNNER_TEMP: $py"; exit 1 ;; esac
          echo "$("$py" --version) at $py"

      # THE PATH PROMISE. The action prepends the venv's bin, so a later bare
      # `python` is the venv's — this is what lets every caller in the fleet
      # write the same `python -m ruff` regardless of how the box is set up.
      - name: a later step's bare `python` is the venv's
        run: |
          python - <<'PY'
          import sys
          if sys.prefix == sys.base_prefix:
              raise SystemExit(f"::error::bare python is not the venv: {sys.executable}")
          print(f"bare python -> {sys.executable}")
          PY

      # And the console script, which is the exact thing whose absence produced
      # `ruff: command not found` (exit 127) in hadoku-scraper on 2026-09-24.
      - name: the console script exists and is the pinned one
        run: |
          v=$(ruff --version)
          [ "$v" = "ruff 0.16.9" ] || { echo "::error::ruff is '$v', expected 'ruff 0.16.9'"; exit 1; }
          echo "$v, and it is on PATH"

      - name: install can be skipped
        uses: ./setup-python-venv
        with:
          cache: ''
          install: ''

  # The guard, in its own job: it has to meet a runner with no venv already at
  # $RUNNER_TEMP/venv, which the job above leaves behind.
  setup-python-venv-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Asserted by RUNNING it and checking the step failed. The isolation
      # assert is the entire reason this action is more than three lines of
      # shell, so a version of it that cannot fail would be worse than none.
      #
      # `json` is the probe because the stdlib genuinely lives in the BASE
      # interpreter, outside the venv — it is the honest shape of the thing
      # being guarded against, not a contrived input.
      - name: a module resolving outside the venv is refused
        id: outside
        continue-on-error: true
        uses: ./setup-python-venv
        with:
          cache: ''
          install: ''
          assert-imports: json

      - name: a module that is not installed at all is refused
        id: missing
        continue-on-error: true
        uses: ./setup-python-venv
        with:
          cache: ''
          install: ''
          assert-imports: definitely_not_installed

      - name: assert both refusals actually fired
        run: |
          fail=0
          if [ "${{ steps.outside.outcome }}" != "failure" ]; then
            echo "::error::a module from outside the venv was accepted"; fail=1
          fi
          if [ "${{ steps.missing.outcome }}" != "failure" ]; then
            echo "::error::a missing module was accepted"; fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "the isolation assert fires on both shapes"

name: ppe promote

# REUSABLE. Each adopting repo calls it from a thin
# .github/workflows/ppe-promote.yml (README "ppe promotion"):
#
#   on:
#     workflow_run: { workflows: [CI], types: [completed], branches: [ppe] }
#     workflow_dispatch: { inputs: { force: { type: boolean, default: false } } }
#
# EVENT-DRIVEN, never a per-repo cron: every job here mints a claw, and a
# 5-minute cron across the fleet is ~400 mints an hour for nothing. A CI run
# finishing on ppe is the only moment the answer can change, and the one case
# no event covers (ppe goes quiet inside the 30-minute window) is woken by
# fleet-manager's in-process ppe sweep, which dispatches this with no inputs.
#
# Every read uses the job's own GITHUB_TOKEN (a per-repo budget), so this
# spends nothing from the fleet's shared GitHub token. Pushes use the repo's
# deploy key over ssh: a push by GITHUB_TOKEN triggers no workflow, and the
# promotion must trigger main's publish/deploy and a revert must trigger CI.
on:
  workflow_call:
    inputs:
      runner:
        description: >-
          The caller's runs-on, as JSON: pass the caller's vars.CI_RUNNER. An
          input rather than vars read here, so it is unambiguously the
          CALLER's variable.
        type: string
        required: true
      force:
        description: Promote the newest green now, ignoring the cadence.
        type: boolean
        default: false
      report-job-name:
        description: "worker:job name for report-job (e.g. myrepo:ppe-promote). Empty skips the report."
        type: string
        default: ''
    secrets:
      deploy-key:
        description: The repo's write deploy key (PPE_PROMOTE_KEY).
        required: true
      service-key:
        description: The repo's KEY_SERVICE_* for report-job. Optional.
        required: false

jobs:
  promote:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 10
    # One at a time per repo. GitHub keeps one running and one pending per
    # group, so a burst of CI completions collapses into one more decision on
    # the newest state, which is exactly what a later run would decide anyway.
    concurrency:
      group: ppe-promote-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Mark the start, so the reported duration is real
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Promote
        uses: WolffM/hadoku-actions/promote@v1
        with:
          deploy-key: ${{ secrets.deploy-key }}
          github-token: ${{ github.token }}
          force: ${{ inputs.force }}

      - name: Report the outcome so a silent failure can't hide
        if: always() && inputs.report-job-name != ''
        uses: WolffM/hadoku-actions/report-job@v1
        with:
          job-name: ${{ inputs.report-job-name }}
          service-key: ${{ secrets.service-key }}
          started-at: ${{ env.JOB_STARTED_AT }}
          timeout-minutes: 10

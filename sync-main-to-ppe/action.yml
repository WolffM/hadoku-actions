name: Sync main into ppe
description: >-
  Merge main into ppe when main holds a commit ppe lacks (a bot's push, or an
  operator hotfix), so promotion stays a fast-forward. A promotion's push is
  already in ppe and changes nothing. A conflict is reported as an issue and
  fails the step; it is never forced. Usually called through the reusable
  workflow .github/workflows/sync-main-to-ppe.yml.

inputs:
  deploy-key:
    description: The repo's write deploy key (secret PPE_PROMOTE_KEY), private half.
    required: true
  github-token:
    description: The job's own GITHUB_TOKEN, for the conflict issue (issues write).
    required: true
  ppe-branch:
    required: false
    default: ppe
  main-branch:
    required: false
    default: main

outputs:
  action:
    description: none | merged | conflict | could-not-look
    value: ${{ steps.sync.outputs.action }}

runs:
  using: composite
  steps:
    - id: sync
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PPE_DEPLOY_KEY: ${{ inputs.deploy-key }}
        PPE_BRANCH: ${{ inputs.ppe-branch }}
        PPE_MAIN_BRANCH: ${{ inputs.main-branch }}
      run: node "$GITHUB_ACTION_PATH/../promote/sync.mjs"

name: Stage for npmjs
description: >-
  Pack an already-built @wolffm/* workspace package, rewrite it to @hadoku/*,
  run the leak gate and hand the tarball to publish-npmjs/publish, which
  publishes it to npmjs from a GitHub-hosted job in the same run.

# WHY THIS EXISTS
# ---------------
# GitHub Packages' npm registry demands a token even for a public package, so
# hadoku-cardtable (a public repo) could not be built by anyone outside the
# fleet. npmjs serves public packages anonymously. Only the names listed in
# public-packages.json go there; every other @wolffm/* package stays private on
# GitHub Packages, and the fleet keeps installing all of them from there.
#
# Consumers outside the fleet keep importing @wolffm/* and alias the names:
#   "@wolffm/themes": "npm:@hadoku/themes@5.12.12"
# prepare.mjs explains the dependency rewrite that makes that work transitively.
#
# WHY TWO HALVES
# --------------
# npmjs publishes through trusted publishing (OIDC), not a token: a token that
# publishes without a one-time password is what npm is retiring, and one that
# asks for it cannot run in CI. Trusted publishing does not accept self-hosted
# runners, so the build and this gate stay on ours and only the `npm publish`
# moves to a GitHub-hosted job — which holds no secret and runs no repo code.
#
# A PUBLISH THERE IS PERMANENT. npmjs allows an unpublish for 72 h only and a
# version number can never be reused, so the gate runs here, before anything
# leaves the runner, and `dry-run` exists to read the file list first.
#
# Needs node and pnpm on PATH (setup-pnpm), and the package already built: it
# packs exactly what `pnpm publish` would, including workspace: resolution.

inputs:
  package-dir:
    description: The workspace package to stage, relative to the repo root.
    required: true
  dry-run:
    description: "'true' packs, rewrites and gates, prints the file list, and uploads nothing."
    required: false
    default: 'false'

outputs:
  name:
    description: The npmjs name, @hadoku/<name>.
    value: ${{ steps.prepare.outputs.name }}
  version:
    description: The version, identical to the GitHub Packages one.
    value: ${{ steps.prepare.outputs.version }}

runs:
  using: composite
  steps:
    - name: Pack, rewrite and gate
      id: prepare
      shell: bash
      env:
        PACKAGE_DIR: ${{ inputs.package-dir }}
      run: |
        set -euo pipefail
        work="$RUNNER_TEMP/publish-npmjs.$$"
        mkdir -p "$work/tgz" "$work/upload"
        echo "work=$work" >> "$GITHUB_OUTPUT"
        (cd "$PACKAGE_DIR" && pnpm pack --pack-destination "$work/tgz" >/dev/null)
        tgz=$(ls "$work"/tgz/*.tgz)
        node "$GITHUB_ACTION_PATH/prepare.mjs" "$tgz" "$work/out"
        # Repacked HERE so the hosted job publishes these exact gated bytes;
        # scripts were already cut down to install hooks, and none run on pack.
        npm pack "$work/out/package" --ignore-scripts --pack-destination "$work/upload" >/dev/null
        name=$(node -p "require('$work/out/package/package.json').name")
        echo "artifact=npmjs-${name#@hadoku/}" >> "$GITHUB_OUTPUT"

    - name: Hand the tarball to the publish job
      if: inputs.dry-run != 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.prepare.outputs.artifact }}
        path: ${{ steps.prepare.outputs.work }}/upload/*.tgz
        if-no-files-found: error
        retention-days: 1

    - name: Clean up
      if: always()
      shell: bash
      env:
        WORK: ${{ steps.prepare.outputs.work }}
      run: '[ -z "$WORK" ] || rm -rf "$WORK"'

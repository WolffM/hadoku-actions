name: Report job outcome
description: >-
  POST this job's outcome to the fleet execution log, so a silent failure cannot
  hide. Never fails the job it reports on.

# WHY A JOB REPORTS AT ALL
# ------------------------
# Nothing polls these repos' workflows — monitoring-api's ci-check list is
# derived from the fleet roster and does not cover every repo — so a red run is
# seen by exactly nobody unless it says so itself. On 2026-08-04 hadoku-task's
# auto-update failed ten times in a row and told no one until the next daily
# digest.
#
# `POST /health/api/jobs` is the fleet's ONE alerting path. monitoring-api hangs
# the Discord alert on the outcome itself (job-alerts.ts), throttled to one
# reminder per 24h with a recovery notice when it goes green, and folds it into
# the `crons` domain of `GET /health/api/sitrep` — so a repo goes red where the
# operator already looks. Routing is hadoku_site's business; a repo's job is to
# be honest about its own state.
#
# NOT `/health/api/telemetry`. That path writes the ledger and alerts nobody,
# which is the same silence this action exists to end.
#
# `always()` at the call site so RECOVERIES are reported too: without the
# success side the alert state stays broken, and the next real failure arrives
# as a suppressed reminder rather than a new alert. `always()` is not total,
# though — it cannot cover the runner process dying, because then there is
# nothing left to evaluate a condition. That class is covered from outside, by a
# caller reporting the PREVIOUS run (see tenhands taskauto.yml).
#
# WHY THIS LIVES IN ITS OWN PUBLIC REPO
# -------------------------------------
# It began as six near-identical copies of the same curl+jq across three repos,
# and they had already drifted: an unset-key guard in one and not another, two
# different duration sources, three different error strings. Vendoring the file
# per repo (2026-08-30) collapsed the drift but not the duplication, and that
# left two costs.
#
# A local `uses: ./.github/actions/...` is a PATH INTO THE WORKSPACE, so every
# caller must run actions/checkout first. tenhands' deploy.yml is a pure
# dispatch job that needs no checkout, and it went red the moment it gained this
# step — 2026-08-30, and the failure was in the reporter that exists so a silent
# failure cannot hide. Referenced instead of vendored, the runner fetches this
# before the job's first step, so that bug cannot be written.
#
# And wiring a new repo meant hand-copying 5.5KB, which nobody does 21 times:
# 21 of the 26 repos in fleet coverage reported nothing at all, including
# hadoku-fleet-manager, whose CI sat red for 46 runs across ten hours with the
# daily digest as the first and only notice. Adding a repo is now five lines.
#
# BLAST RADIUS IS THE TRADE. A bad push here breaks every caller at once, where
# a vendored copy broke one. `v1` is therefore a RELEASE TAG, moved deliberately
# after the self-test passes — never a branch alias. See README.md.

inputs:
  job-name:
    description: 'Execution-log job name, "worker:job" (the colon is required).'
    required: true
  service-key:
    description: >-
      This repo's service-tier registry key, sent as X-User-Key. A missing key
      warns and skips rather than failing the run.
    required: true
  outcome:
    description: 'The job status to translate. Defaults to the calling job''s.'
    required: false
    default: ${{ job.status }}
  started-at:
    description: >-
      Epoch seconds the job began, for duration_ms. Set it in the first step
      with `echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"`. Omitted
      means duration 0.
    required: false
    default: ''
  error-message:
    description: 'Error text recorded on failure. Defaults to a link to the run.'
    required: false
    default: ''
  timeout-minutes:
    description: >-
      The calling job's own `timeout-minutes`. GitHub reports a timeout kill as
      `cancelled`, the same outcome as concurrency superseding a run; with this
      set, a cancel that arrives at or past the limit is reported as a failure.
      Needs `started-at`. Omitted means every cancel stays unreported.
    required: false
    default: ''
  extra-jobs:
    description: >-
      Further outcomes to post in the same call, as a JSON array of
      `{"name": "worker:job", "outcome": "success|failure", "started-at": N,
      "error": "..."}` objects. For a job that does several named units of work
      in one go — see "Reporting N units from one job" in action.yml.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      env:
        JOB_NAME: ${{ inputs.job-name }}
        SERVICE_KEY: ${{ inputs.service-key }}
        OUTCOME: ${{ inputs.outcome }}
        STARTED_AT: ${{ inputs.started-at }}
        ERROR_MESSAGE: ${{ inputs.error-message }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        EXTRA_JOBS: ${{ inputs.extra-jobs }}
        RUN_ID: ${{ github.run_id }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -u
        # Checked before the outcome, so a bad value is refused on the green
        # run that wires it, not on the one night the job times out.
        if [ -n "$TIMEOUT_MINUTES" ]; then
          case "$TIMEOUT_MINUTES" in
            0*|*[!0-9]*) echo "::error::timeout-minutes must be a positive whole number of minutes, got '$TIMEOUT_MINUTES'"; exit 1 ;;
          esac
          if [ -z "$STARTED_AT" ]; then
            echo "::error::timeout-minutes needs started-at — without it a timeout cannot be told from a cancel"
            exit 1
          fi
        fi

        # A cancel (concurrency superseded the run) is not breakage, and must
        # not clear a live failure streak either — stay silent. That silence
        # covers `extra-jobs` too: a superseded or keyless job reports nothing
        # at all, not a partial set of its units.
        #
        # EXCEPT a timeout. GitHub reports a `timeout-minutes` kill as
        # `cancelled` too, and that IS breakage: hadoku-dataplatform's nightly
        # e2e was killed at 60 min on 2026-10-24 and wrote no row, so the
        # digest called it green (hadoku-actions#2). The job's age tells them
        # apart. GRACE because started-at is stamped by the job's first step,
        # a few seconds after the clock timeout-minutes runs on — measured
        # there, the kill landed 3,610s after started-at against a 3,600s
        # limit. A supersede inside the last minute reads as a timeout; that
        # job was about to be one anyway.
        timed_out=
        case "$OUTCOME" in
          success) status=succeeded ;;
          failure) status=failed ;;
          cancelled)
            grace=60
            if [ -n "$TIMEOUT_MINUTES" ] && [ $(( $(date -u +%s) - STARTED_AT )) -ge $(( TIMEOUT_MINUTES * 60 - grace )) ]; then
              status=failed
              timed_out=1
            else
              echo "outcome=$OUTCOME — not reported"; exit 0
            fi
            ;;
          *) echo "outcome=$OUTCOME — not reported"; exit 0 ;;
        esac

        if [ -z "$SERVICE_KEY" ]; then
          echo "::warning::service key unset — $JOB_NAME outcome not reported"
          exit 0
        fi

        # `worker:job`. monitoring-api derives `worker` from the prefix, and a
        # colon-less name lands under a worker equal to the whole name where no
        # ?worker= query can find it. Its own guard for this could not fire
        # until 2026-08-30, so say it here too.
        case "$JOB_NAME" in
          *:*) ;;
          *) echo "::error::job-name must be \"worker:job\", got '$JOB_NAME'"; exit 1 ;;
        esac

        if [ -n "$STARTED_AT" ]; then
          duration_ms=$(( ($(date -u +%s) - STARTED_AT) * 1000 ))
        else
          duration_ms=0
        fi

        if [ -n "$timed_out" ]; then
          err="timed out after $TIMEOUT_MINUTES min — $RUN_URL"
        else
          err="${ERROR_MESSAGE:-$JOB_NAME failed — $RUN_URL}"
        fi

        # One POST per outcome: this job's own, then one per `extra-jobs` entry.
        #
        # run_id is `gha_<run id>`, and POST /health/api/jobs UPSERTS on it, so a
        # second write for the same run updates the row rather than inventing a
        # second failure.
        # The key must identify a JOB within a run, not the run. `gha_<run id>`
        # alone meant every reporting job in one workflow wrote the SAME row and
        # the last one won — observed 2026-09-02, where
        # site:deploy-workers:detect-changes was overwritten by
        # site:deploy-worker:jobplatform-api. Across a matrix that is a false
        # green: a failed worker's row replaced by a later worker's success.
        # `extra-jobs` would have the same collision for free, since every entry
        # posts from ONE job — the slug is what keeps the N rows apart.
        #
        # The slug keeps the property the upsert exists for — the SAME job
        # re-posting for the same run still updates its own row rather than
        # inventing a second failure, which is what tenhands' taskauto relies on
        # when it posts a previous run's conclusion — while giving each job its
        # own row. The value stays opaque; nothing parses it back to a run number.
        # The job's own temp dir, never a fixed name in the shared /tmp: two jobs
        # on one node overwrote each other's body, and a file left by another
        # user cannot be overwritten at all. claw-5, 2026-10-28: after its CI
        # moved to its own user, admin's old /tmp/report-job.json turned every
        # green job red with "Permission denied". A per-POST suffix because one
        # call now writes several bodies.
        posted=0
        post() {
          local name=$1 st=$2 dur=$3 why=$4 body slug hdr code
          posted=$((posted + 1))
          body="${RUNNER_TEMP:-$(mktemp -d)}/report-job-$$-$posted.json"
          slug=$(printf '%s' "$name" | tr -c 'A-Za-z0-9' '-' | sed 's/-\{2,\}/-/g; s/^-//; s/-$//')
          jq -n --arg st "$st" --arg run "gha_${RUN_ID}_${slug}" --arg name "$name" \
                --arg err "$why" --argjson d "$dur" \
            '{job_name: $name, status: $st, run_id: $run, duration_ms: $d}
             + (if $st == "failed" then {error: $err} else {} end)' > "$body"

          # Never fail the job over a reporting blip. `-f` so a non-2xx shows.
          # Bounded, because the `||` below only runs once curl returns: on
          # 2026-10-29 an unanswered POST held watchparty's green `rust` job for
          # 38 minutes until its timeout-minutes killed it, and the run read as
          # cancelled (hadoku-actions#4).
          #
          # A GitHub-HOSTED runner never gets through: hadoku.me's Bot Fight Mode
          # answers every request from those IPs with a challenge page (403,
          # `cf-mitigated: challenge`) before any worker runs. Every npmjs job
          # reported into that wall from day one and read as a generic warning,
          # so nobody knew its failures could not page. Say which wall it is.
          hdr="${body%.json}.headers"
          code=$(curl -sS --connect-timeout 10 --max-time 30 -o /dev/null -D "$hdr" -w '%{http_code}' \
            -X POST https://hadoku.me/health/api/jobs \
            -H "X-User-Key: $SERVICE_KEY" \
            -H 'Content-Type: application/json' \
            --data @"$body") || true
          case "$code" in
            2??) echo "reported $name=$st (${dur}ms)" ;;
            *)
              if grep -qi '^cf-mitigated:' "$hdr" 2>/dev/null; then
                echo "::warning::could not report $name: Cloudflare challenged this runner (HTTP $code). A GitHub-hosted runner cannot reach hadoku.me; report this job from a self-hosted job that needs it, with outcome set to needs.<job>.result."
              else
                echo "::warning::could not report $name to monitoring-api (HTTP ${code:-none})"
              fi
              ;;
          esac
        }

        post "$JOB_NAME" "$status" "$duration_ms" "$err"

        [ -n "$EXTRA_JOBS" ] || exit 0

        # REPORTING N UNITS FROM ONE JOB
        # ------------------------------
        # A job that deploys six workers in one go still owes six named
        # outcomes: monitoring-api hangs the alert streak and the recovery
        # notice on the job NAME, so one row per job would make a persistently
        # broken worker indistinguishable from a flaky sibling, and the digest
        # could no longer say which one. hadoku_site's deploy-workers.yml ran
        # one job per changed worker for exactly that reason, and paid a queue
        # wait, a checkout and an install per worker for it (p90 671s
        # end-to-end, hadoku_site#626).
        #
        # A `uses:` step cannot be looped over a list the job computed, so the
        # names come in as data instead. Each entry carries its OWN
        # `started-at`, because the point of collapsing the jobs is that the
        # work is sequential — the job's duration is not any one unit's.
        #
        # Malformed input is refused rather than skipped (`exit 1`, like a
        # colon-less `job-name`): an entry silently dropped is the silence this
        # whole action exists to end. An entry whose `outcome` is empty or
        # unreportable is NOT malformed — that is a unit the job never reached,
        # and it stays unreported, the same as a cancelled job.
        if ! printf '%s' "$EXTRA_JOBS" | jq -e 'type == "array"' >/dev/null 2>&1; then
          echo "::error::extra-jobs must be a JSON array, got '$EXTRA_JOBS'"
          exit 1
        fi

        count=$(printf '%s' "$EXTRA_JOBS" | jq 'length')
        i=0
        while [ "$i" -lt "$count" ]; do
          entry=$(printf '%s' "$EXTRA_JOBS" | jq -c ".[$i]")
          at="extra-jobs[$i]"
          i=$((i + 1))
          if [ "$(printf '%s' "$entry" | jq -r 'type')" != "object" ]; then
            echo "::error::$at must be an object, got '$entry'"
            exit 1
          fi
          e_name=$(printf '%s' "$entry" | jq -r '.name // ""')
          e_outcome=$(printf '%s' "$entry" | jq -r '.outcome // ""')
          e_started=$(printf '%s' "$entry" | jq -r '."started-at" // ""')
          e_error=$(printf '%s' "$entry" | jq -r '.error // ""')

          case "$e_name" in
            *:*) ;;
            *) echo "::error::$at.name must be \"worker:job\", got '$e_name'"; exit 1 ;;
          esac
          case "$e_outcome" in
            success) e_status=succeeded ;;
            failure) e_status=failed ;;
            *) echo "$at $e_name outcome=$e_outcome — not reported"; continue ;;
          esac
          case "$e_started" in
            '') e_duration=0 ;;
            *[!0-9]*) echo "::error::$at.started-at must be epoch seconds, got '$e_started'"; exit 1 ;;
            *) e_duration=$(( ($(date -u +%s) - e_started) * 1000 )) ;;
          esac

          post "$e_name" "$e_status" "$e_duration" "${e_error:-$e_name failed — $RUN_URL}"
        done

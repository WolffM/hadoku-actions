name: Report tests
description: >-
  Read every test report a job wrote (Playwright, vitest, jest, pytest,
  node:test, any JUnit XML) into one per-test document, print it, and post it
  to the fleet test store. Advisory: it never fails the job.

# WHY
# ---
# The fleet's tests ran on six runners with no common record: a test that has
# never failed, or one that costs a runner-hour a day, could not be found
# without downloading job logs. This action is the one reader every repo's test
# step calls, unit and e2e alike, so every suite lands in the same shape
# (hadoku_site docs/planning/unified-test-reporting-2026-11-23.md).
#
# It parses, prints, writes `report-tests.json`, warns on anything it could
# not read, and posts the document to the fleet test store (hadoku_site
# monitoring-api `POST /health/api/tests/runs`) with the repo's service key.
# Until its warnings across the fleet have been read, it never fails a job: an
# unset key or a refused post is a warning too, and the test step's own exit
# code already fails a red job.
#
# `if: always()` at the call site, so a red run is read too.

inputs:
  reports:
    description: >-
      One report per line, `<runner> <path>`. runner: playwright, vitest, jest,
      pytest, node-test or junit (cargo-nextest and any other JUnit XML).
    required: true
  suite:
    description: The suite's stable name in this repo (default the job id).
    default: ''
  kind:
    description: unit or e2e.
    default: unit
  key:
    description: >-
      This repo's KEY_SERVICE_<APP> service-tier key, sent as X-User-Key. Unset:
      the document is written and printed but not posted (a warning).
    default: ''
  endpoint:
    description: The fleet test store's ingest URL.
    default: https://hadoku.me/health/api/tests/runs
  relay:
    description: >-
      'true' for a repo whose CI cannot reach the store and must hold no key
      (GitHub-hosted runners: Cloudflare challenges them). The document is
      uploaded as the artifact `report-tests-<suite>` instead of posted, and
      the hub posts it (hadoku_site mgmt-api scraper-collab:deploy-on-green).
    default: 'false'

outputs:
  document:
    description: Path of the normalised document.
    value: ${{ steps.parse.outputs.document }}

runs:
  using: composite
  steps:
    - id: parse
      shell: bash
      env:
        REPORTS: ${{ inputs.reports }}
        SUITE: ${{ inputs.suite }}
        KIND: ${{ inputs.kind }}
        OUT: ${{ runner.temp }}/report-tests.json
      run: |
        node "$GITHUB_ACTION_PATH/cli.mjs" || echo "::warning title=report-tests::the reader itself crashed (exit $?)"
        echo "document=$OUT" >> "$GITHUB_OUTPUT"
        echo "suite=${SUITE:-${GITHUB_JOB:-tests}}" >> "$GITHUB_OUTPUT"
    # A relayed document waits for the hub as an artifact. Every outcome is
    # uploaded, cancelled included: the hub reads the run's conclusion and
    # skips a cancelled one, as the post step below does.
    - name: upload the document for the hub to post
      if: inputs.relay == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: report-tests-${{ steps.parse.outputs.suite }}
        path: ${{ steps.parse.outputs.document }}
        retention-days: 7
        overwrite: true
        if-no-files-found: warn
    - name: post to the fleet test store
      if: inputs.relay != 'true'
      shell: bash
      env:
        DOC: ${{ runner.temp }}/report-tests.json
        SERVICE_KEY: ${{ inputs.key }}
        ENDPOINT: ${{ inputs.endpoint }}
        JOB_STATUS: ${{ job.status }}
      # A cancelled job (superseded by a newer push, or stopped by hand) is
      # not a test result: the suite it cut off would land as `missing`, which
      # reads as a crash. It is printed above and not posted.
      run: |
        if [ "$JOB_STATUS" = cancelled ]; then
          echo "::notice title=report-tests::the job was cancelled: its document is printed above and not posted"
          exit 0
        fi
        node "$GITHUB_ACTION_PATH/post.mjs" || echo "::warning title=report-tests::the poster itself crashed (exit $?)"

name: Report e2e results
description: >-
  Parse a Playwright or vitest JSON report into one row per test and POST it
  to monitoring-api's e2e_results store, enforcing the skip rule. Fails the
  job on 0 tests, an unallowed skip, a failed test, OR a failure to report
  (an unset key, a non-2xx response, or a network error) — a run whose
  results never arrived must look exactly as broken as a run with a real
  failing test, never like a quiet green night.

# WHY THIS IS SEPARATE FROM report-job
# -------------------------------------
# report-job records one row per WORKFLOW JOB ("did the build succeed").
# This records one row per TEST ("which spec, which outcome, how many
# attempts") — a different shape, a different store (e2e_results, not
# job_executions), and a different question (fleet e2e coverage, not CI
# health). A child repo's e2e.yml uses both: report-job says the workflow
# ran; this says what its tests did.
#
# hadoku_site's wave3-2026-10-21.md §Contract is the source of truth for the
# wire shape (POST /health/api/e2e/results) and the vocabulary
# (passed|failed|flaky|skipped). Changing either is a hadoku_site change
# first — this action only implements it.
#
# PYTEST IS WAVE 4. An unrecognised `runner` fails loudly in parse.mjs rather
# than silently reporting nothing, because a report full of untranslated test
# names is worse than a visible gap.
#
# A FAILED REPORT MUST FAIL THE JOB, DELIBERATELY NOT A WARNING. monitoring-api's
# digest and the roster read `e2e_results` as the record of what happened; an
# app that silently failed to report reads as an app that simply didn't run
# that night, not as a red one — and the wave's own rule is that a job
# measuring something must fail on zero rows. So an unset/empty `key`, a
# non-2xx response, or a network error to the store all fail the job, exactly
# like a failed test does. The three steps below still run in order — parse,
# POST (always, even when tests failed), then one step failing on the UNION of
# test failures, the skip rule, and any POST failure — so the store always
# gets whatever could be posted before the job goes red.

inputs:
  report:
    description: Path to the runner's JSON reporter output (relative to the workspace).
    required: true
  runner:
    description: "'playwright' or 'vitest'. Anything else fails the step."
    required: true
  app:
    description: App id — what the nightly e2e roster and the digest call this suite.
    required: true
  key:
    description: This repo's KEY_SERVICE_<APP> service-tier key, sent as X-User-Key.
    required: true
  nightly-run-id:
    description: >-
      Correlates this run with nightly-e2e.yml's dispatch. Leave unset for a
      standalone `workflow_dispatch` of the repo's own e2e.yml.
    required: false
    default: ''
  gh-run-id:
    description: Overrides the gh_run_id sent to the store. Defaults to this run's id.
    required: false
    default: ${{ github.run_id }}
  repo:
    description: Overrides the repo sent to the store. Defaults to owner/name.
    required: false
    default: ${{ github.repository }}
  endpoint:
    description: monitoring-api's results endpoint.
    required: false
    default: https://hadoku.me/health/api/e2e/results
  e2e-json:
    description: >-
      Path to e2e.json (relative to the workspace), read for its
      `e2eSkipAllow` map (`{"<test title>": "<one-line reason>"}`). A missing
      FILE is treated as an empty map, never an error — this action does not
      own enrolment. A PRESENT `e2eSkipAllow` of the wrong shape (anything
      other than that map, or a map with a non-string/empty reason) fails the
      job loudly — see parse.mjs.
    required: false
    default: e2e.json

runs:
  using: composite
  steps:
    - name: Parse the report and enforce the skip rule
      id: parse
      shell: bash
      env:
        REPORT_PATH: ${{ inputs.report }}
        RUNNER: ${{ inputs.runner }}
        E2E_JSON_PATH: ${{ inputs.e2e-json }}
      run: |
        set -euo pipefail

        # The FILE's existence is read here, in bash — a missing e2e.json
        # degrades to an empty allow-list rather than failing the step, since
        # this action does not own enrolment. The SHAPE of `e2eSkipAllow`,
        # once a file is present, is deliberately NOT judged here: this step
        # passes whatever value it finds through verbatim (or 'null' when
        # the key or the file is absent) and parse.mjs is the single place
        # that validates it — one shape check, not two that could disagree.
        if [ -f "$E2E_JSON_PATH" ]; then
          SKIP_ALLOW=$(node -e "
            const fs = require('node:fs');
            try {
              const j = JSON.parse(fs.readFileSync(process.env.E2E_JSON_PATH, 'utf8'));
              process.stdout.write(JSON.stringify(j.e2eSkipAllow ?? null));
            } catch {
              process.stdout.write('null');
            }
          ")
        else
          SKIP_ALLOW='null'
        fi
        export SKIP_ALLOW

        node "$GITHUB_ACTION_PATH/parse.mjs" > "$RUNNER_TEMP/report-e2e-parsed.json"

        rows_count=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')).rows.length)" \
          "$RUNNER_TEMP/report-e2e-parsed.json")
        echo "parsed_count=${rows_count}" >> "$GITHUB_OUTPUT"
        echo "parsed ${rows_count} test row(s) from ${RUNNER_TEMP}/report-e2e-parsed.json"

    - name: POST the rows to monitoring-api (always, even on a failing run)
      id: post
      shell: bash
      env:
        SERVICE_KEY: ${{ inputs.key }}
        ENDPOINT: ${{ inputs.endpoint }}
        APP: ${{ inputs.app }}
        REPO: ${{ inputs.repo }}
        GH_RUN_ID: ${{ inputs.gh-run-id }}
        NIGHTLY_RUN_ID: ${{ inputs.nightly-run-id }}
      run: |
        set -uo pipefail
        # Deliberately NOT `set -e` here: a transport failure (an unreachable
        # store, a non-2xx response) must be CAUGHT and recorded as a
        # post-failure, not let an early exit skip the rest of the chunk loop
        # or leave the next step without a post-failures file to read. Every
        # exit path below writes $post_failures before returning.
        post_failures='[]'
        write_post_failures() {
          printf '%s' "$post_failures" > "$RUNNER_TEMP/report-e2e-post-failures.json"
        }

        if [ -z "$SERVICE_KEY" ]; then
          echo "::error::service key unset — ${APP} e2e results could not be reported"
          post_failures='["service key unset — nothing could be reported"]'
          write_post_failures
          exit 0
        fi

        parsed="$RUNNER_TEMP/report-e2e-parsed.json"
        rows_count=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')).rows.length)" "$parsed")
        if [ "$rows_count" -eq 0 ]; then
          echo "0 rows parsed — nothing to POST."
          write_post_failures
          exit 0
        fi

        # §Contract: POST /health/api/e2e/results accepts at most 2,000 rows
        # per request. Chunk rather than assume any one suite stays under it
        # — a batch that would otherwise silently 400 and lose every row.
        node -e "
          const fs = require('node:fs');
          const { rows } = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
          const CHUNK = 2000;
          const chunks = [];
          for (let i = 0; i < rows.length; i += CHUNK) chunks.push(rows.slice(i, i + CHUNK));
          fs.writeFileSync(process.argv[2], JSON.stringify(chunks));
        " "$parsed" "$RUNNER_TEMP/report-e2e-chunks.json"

        chunk_count=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')).length)" "$RUNNER_TEMP/report-e2e-chunks.json")

        inserted_total=0
        failed_chunks=()
        for i in $(seq 0 $((chunk_count - 1))); do
          body=$(node -e "
            const fs = require('node:fs');
            const chunks = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const results = chunks[Number(process.argv[2])];
            const body = { gh_run_id: process.env.GH_RUN_ID, repo: process.env.REPO, app: process.env.APP, results };
            if (process.env.NIGHTLY_RUN_ID) body.nightly_run_id = process.env.NIGHTLY_RUN_ID;
            process.stdout.write(JSON.stringify(body));
          " "$RUNNER_TEMP/report-e2e-chunks.json" "$i")

          # Remove any stale file first — on a hard connect failure curl may
          # write no response body at all, and the error message below must
          # not read a PREVIOUS chunk's leftover content.
          rm -f "$RUNNER_TEMP/report-e2e-post-$i.json"
          status_code=$(curl -sS -o "$RUNNER_TEMP/report-e2e-post-$i.json" -w "%{http_code}" \
            -X POST "$ENDPOINT" \
            -H "X-User-Key: $SERVICE_KEY" \
            -H 'Content-Type: application/json' \
            --data "$body")
          curl_exit=$?
          # A hard network failure (connection refused, DNS, timeout) makes
          # curl exit non-zero; some curl builds still print "000" via -w in
          # that case and some print nothing, so force it explicitly rather
          # than risk an empty status falling through the comparison below.
          # Checked under `set -u` with no `-e`, deliberately, so this failure
          # is CAUGHT and recorded, not let it abort the rest of the loop.
          if [ "$curl_exit" -ne 0 ] || [ -z "$status_code" ]; then
            status_code="000"
          fi

          if [ "$status_code" != "200" ]; then
            resp_body=$(cat "$RUNNER_TEMP/report-e2e-post-$i.json" 2>/dev/null || echo '<no response body>')
            echo "::error::POST ${ENDPOINT} returned HTTP ${status_code} for chunk $((i + 1))/${chunk_count} — ${resp_body}"
            failed_chunks+=("chunk $((i + 1))/${chunk_count} returned HTTP ${status_code}")
          else
            inserted=$(node -e "console.log(JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')).inserted ?? 0)" "$RUNNER_TEMP/report-e2e-post-$i.json")
            inserted_total=$((inserted_total + inserted))
          fi
        done
        echo "reported ${inserted_total}/${rows_count} row(s) for ${APP} to ${ENDPOINT}"

        if [ "${#failed_chunks[@]}" -gt 0 ]; then
          post_failures=$(node -e "
            process.stdout.write(JSON.stringify(process.argv.slice(1).map((s) => 'POST failed: ' + s)));
          " "${failed_chunks[@]}")
        fi
        write_post_failures

    - name: Fail on 0 tests, an unallowed skip, a failed test, or a failed POST
      shell: bash
      run: |
        set -euo pipefail
        parsed="$RUNNER_TEMP/report-e2e-parsed.json"
        post_failures_file="$RUNNER_TEMP/report-e2e-post-failures.json"
        [ -f "$post_failures_file" ] || echo '[]' > "$post_failures_file"

        total=$(node -e "
          const fs = require('node:fs');
          const { failures } = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
          const postFailures = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log(failures.length + postFailures.length);
        " "$parsed" "$post_failures_file")

        if [ "$total" -eq 0 ]; then
          echo "all tests accounted for, and the store confirmed every row — nothing failing the job."
          exit 0
        fi

        echo "::error::report-e2e found ${total} failure(s):"
        node -e "
          const fs = require('node:fs');
          const { failures } = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
          const postFailures = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          for (const f of [...failures, ...postFailures]) console.log('  - ' + f);
        " "$parsed" "$post_failures_file"
        exit 1
